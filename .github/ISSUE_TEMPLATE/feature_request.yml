name: 功能建议
description: 新功能、配置项或行为调整的建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先确认：[README 的「已知限制」](../README.md#已知限制)里列的取舍是否已经覆盖了你的场景。
        本项目完全由 AI 实现，**把"要解决的具体问题"讲清楚比描述方案更有用**——方案可以一起定。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决的问题
      description: 现在遇到了什么麻烦？在什么场景下发生、多久发生一次、影响多大
      placeholder: 例如：某个群文件配额满了，兜底发文件总是失败，希望能在面板上看到每个群还剩多少配额
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法（可选）
      description: 有想法就写，没有也可以。若涉及新的配置项，请顺带说明默认值你希望是哪一边
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你试过的替代方案（可选）
      description: 例如用别的插件、改配置绕过、手动操作等，以及它们为什么不够用
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: 大致属于哪一块
      options:
        - 微博抓取与轮询
        - 推送链路（消息格式 / 重试 / 取消）
        - 视频转发
        - 群相册
        - WebUI 面板
        - 文档
        - 不确定
    validations:
      required: true
