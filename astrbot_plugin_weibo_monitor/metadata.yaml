name: astrbot_plugin_weibo_monitor
display_name: 微博实时转发
desc: 无需微博 Cookie，实时轮询监控指定微博账号，新微博自动推送到绑定的Q群；支持把微博图片自动上传到群相册（不同博主可绑定不同相册），推送消息可附带图片（轻量档，原图进群相册）。
short_desc: 免 Cookie 监控微博更新并实时转发到Q群，图片自动进群相册
version: v1.4.1
author: diyushuang
repo: https://github.com/diyushuang/astrbot_plugin_weibo_monitor
# 上传台账使用 AstrBot KV 存储（v4.9.2 起提供），低于该版本将拒绝加载并明确提示
astrbot_version: ">=4.9.2"
support_platforms:
  - aiocqhttp
