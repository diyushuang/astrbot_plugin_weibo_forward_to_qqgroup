# AstrBot 插件规范要求"提交前用 ruff 格式化代码"，这里固定规则集，
# 免得不同版本的 ruff 默认集漂移导致 CI/本地结果不一致。
#
# 行长放到 100：本插件注释与文档字符串以中文为主，ruff 按全角宽度 2 计算，
# 中文技术说明在 88 列里经常放不下一句完整的话，硬折行反而更难读。
# 纯 ASCII 代码仍由 ruff format 按 100 列排版。
line-length = 100
target-version = "py310"  # AstrBot 4.x 的运行基线

[lint]
# 官方规范明确要求的关键规则，配上常规语法/风格检查
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

ignore = [
  # 本插件大量使用防御性宽捕获：日志留存、KV 台账、面板路由注册等处的
  # "任何异常都不能外抛、不能让插件崩"是刻意设计，不是疏漏。
  # 逐个加 noqa 会让代码被注释淹没，这里统一放开。
  "BLE001",
  # 中文注释里的全角标点/emoji 会被判为"歧义字符"，纯误报
  "RUF001",
  "RUF002",
  "RUF003",
]

[lint.per-file-ignores]
# 基准/实测脚本不属于插件包，允许随意写法
"bench/**" = ["ALL"]

[format]
quote-style = "double"
indent-style = "space"
